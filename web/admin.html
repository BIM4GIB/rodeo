<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rodeo Admin</title>
    <meta name="theme-color" content="#1d1d1d" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- the editor's theme, before the first paint -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("openvwx.theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="./src/admin/admin.css" />
  </head>
  <body>
    <div class="adm" id="admin"></div>
    <script type="module" src="./src/admin/main.ts"></script>
  </body>
</html>
